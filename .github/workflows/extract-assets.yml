name: Extract portfolio images
on:
  push:
    paths:
      - 'AGATA_THUMBNAILS_20.zip'
      - '.github/workflows/extract-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract images
        run: unzip -oq AGATA_THUMBNAILS_20.zip -d .
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add original portfolio thumbnails and banner"
            git push
          fi
